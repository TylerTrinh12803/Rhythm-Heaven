<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Rhythm Heaven</title>
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="icon-192.png">
        <meta name="theme-color" content="#040218">
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                height: 100%;
            }

            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
                /* stop mobile browsers from scrolling/zooming while you swipe */
                touch-action: none;
                overscroll-behavior: none;
            }

            ol, ul {
                list-style: none;
            }

            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }

            a {
                text-decoration: none;
                color: inherit;
            }

            /* ---- nickname entry overlay (used by the Scoreboard screen) ---- */
            #name-overlay {
                position: fixed;
                inset: 0;
                display: none;               /* shown by the game */
                align-items: center;
                justify-content: center;
                background: rgba(0, 0, 0, 0.75);
                z-index: 10;
            }
            #name-box {
                background: #1c1a2e;
                border: 4px solid #ff8de1;
                border-radius: 8px;
                padding: 24px 28px;
                width: min(90vw, 360px);
                text-align: center;
                font-family: 'Courier New', monospace;
                color: #ffffff;
            }
            #name-box h2 { font-size: 20px; margin-bottom: 14px; }
            #name-msg { min-height: 18px; font-size: 14px; color: #ffa94d; margin-bottom: 10px; }
            #name-input {
                width: 100%;
                font-size: 20px;
                font-family: 'Courier New', monospace;
                padding: 10px;
                border: 3px solid #7ec8ff;
                border-radius: 6px;
                background: #0d0c18;
                color: #ffffff;
                text-align: center;
                outline: none;
                margin-bottom: 14px;
            }
            #name-box button {
                font-size: 18px;
                font-family: 'Courier New', monospace;
                padding: 10px 18px;
                margin: 0 6px;
                border: 3px solid #ffffff;
                border-radius: 6px;
                cursor: pointer;
            }
            #name-ok { background: #2f9e44; color: #ffffff; }
            #name-skip { background: #55506e; color: #ffffff; }

            /* ---- offline notification banner ---- */
            #offline-banner {
                position: fixed;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                display: none;               /* shown automatically when offline */
                background: #b3341f;
                color: #ffffff;
                font-family: 'Courier New', monospace;
                font-size: 14px;
                padding: 6px 14px;
                border-radius: 0 0 8px 8px;
                z-index: 20;
                text-align: center;
                max-width: 92vw;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>

        <!-- nickname entry (native input = phone keyboards work) -->
        <div id="name-overlay">
            <div id="name-box">
                <h2 id="name-title">Enter your nickname!</h2>
                <div id="name-msg"></div>
                <input id="name-input" maxlength="12" placeholder="2-12 letters" autocomplete="off">
                <div>
                    <button id="name-ok">OK!</button>
                    <button id="name-skip">Skip</button>
                </div>
            </div>
        </div>

        <!-- shows whenever the player has no internet -->
        <div id="offline-banner">⚠ Offline — connect to WiFi to upload or view the scoreboard. The game still works!</div>

        <script>
            // ---- OFFLINE SUPPORT ----
            // Service worker caches the whole game on the first visit, so it
            // keeps working with no internet afterwards.
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
            // Offline banner: appears/disappears as the connection changes.
            (function () {
                const banner = document.getElementById('offline-banner');
                const update = () => { banner.style.display = navigator.onLine ? 'none' : 'block'; };
                window.addEventListener('online', update);
                window.addEventListener('offline', update);
                update();
            })();
        </script>
        <script src="./phaser.js"></script>
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
